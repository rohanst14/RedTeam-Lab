<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedTeam-Lab</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">AI SAFETY / EVALUATION WORKBENCH</p><h1>RedTeam-Lab</h1><p>Controlled safety regression · deterministic fixture mode</p></header><section class="controls"><label for="mode">Control condition</label><select id="mode"><option value="protected">Protected fixture</option><option value="unprotected">Unprotected fixture</option></select><button id="run">Run evaluation</button><button id="export" disabled>Export JSON</button><span id="status" role="status"></span></section><div id="metrics" class="metrics" aria-live="polite"></div><section><h2>Case-level results</h2><div class="scroll"><table><thead><tr><th>Case</th><th>Category</th><th>Outcome</th><th>Latency (ms)</th><th>Findings</th></tr></thead><tbody id="cases"></tbody></table></div></section><section><h2>Run history</h2><div id="history"></div></section><footer>Fixture results validate scoring, not model safety. Local model evaluations are available through the CLI.</footer></main><script src="app.js"></script></body></html>
